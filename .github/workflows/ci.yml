name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Version constant matches package.json
        # src/version.ts is what the User-Agent carries; package.json is what the
        # publish job gates the tag on. A drift here ships a lying UA.
        run: |
          want="$(node -p "require('./package.json').version")"
          got="$(node -p "require('fs').readFileSync('src/version.ts','utf8').match(/\"(.*)\"/)[1]")"
          if [ "$want" != "$got" ]; then
            echo "::error::src/version.ts is $got but package.json is $want"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    # Tag pushes only (v0.1.0, v1.2.3, ...): publish to npm. No token: npmjs.com
    # trusts this repo's ci.yml as the package's trusted publisher (OIDC), so
    # renaming this file breaks publishing until the npm setting is updated too.
    needs: test
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing trades this job's OIDC token for a publish token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($want). Bump the version or retag."
            exit 1
          fi
      - name: npm with trusted publishing (needs >= 11.5.1; Node 22 ships 10.x)
        run: npm install -g npm@11
      - run: npm publish --provenance --access public
